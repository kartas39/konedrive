[package]
name = "konedrived"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# Test-only, like the helper's feature of the same name: one
# stall the VM suite arms to widen a race window too narrow to hit by chance
# (startup recovery between its `ClearIgnore` and its lease). Off
# by default; never enable it in a build that ships. `tests/vm/Cargo.toml`
# turns it on for the suite's own build of this crate. It also builds the fake
# OneDrive (`sync::upload::fake`, on wiremock), which the suite's write scenarios
# run the daemon against inside the VM.
fault-injection = ["dep:wiremock"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
dirs.workspace = true
futures-util.workspace = true
getrandom.workspace = true
image.workspace = true
konedrive-dbus = { path = "../konedrive-dbus" }
konedrive-fs = { path = "../konedrive-fs" }
konedrive-proto = { path = "../konedrive-proto" }
libc.workspace = true
md-5.workspace = true
nix = { workspace = true, features = ["fs", "mount", "socket"] }
oo7.workspace = true
png.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "process"] }
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
xattr.workspace = true
zbus.workspace = true
# Only with `fault-injection`: the fake OneDrive of the VM suite.
wiremock = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
# Tests only: the paused clock, which drives the 5 s spacing of `LocalBytes`
# and the coalescing of `PropertiesChanged` without a real wait.
tokio = { workspace = true, features = ["test-util"] }
wiremock.workspace = true
