[package]
name = "konedrive-tree"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# What the daemon's tests and the VM suite use of the store that nothing shipped does: a store
# in memory, `off_runtime`, `all_items`, the bench's `bench_sql` and `bench_insert`, and the
# questions only a test asks (`outbox_record`, `outbox_under`, `outbox_blockers`,
# `outbox_runnable`, `upload_opening_at`, `conflict_kind`). Only tests turn it on (the
# daemon's as a dev-dependency); nothing that ships is built with it.
testing = []

[dependencies]
konedrive-fs = { path = "../konedrive-fs" }
konedrive-reason = { path = "../konedrive-reason" }
rusqlite.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
libc.workspace = true
tempfile.workspace = true
