[package]
name = "konedrive-tree"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# What the daemon's tests use of the store that nothing shipped does: a store
# in memory, `off_runtime` and the bench's `bench_sql`. Only tests turn it on (the
# daemon's as a dev-dependency); nothing that ships is built with it.
testing = []

[dependencies]
icu_normalizer.workspace = true
konedrive-fs = { path = "../konedrive-fs" }
konedrive-reason = { path = "../konedrive-reason" }
rusqlite.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
libc.workspace = true
tempfile.workspace = true
