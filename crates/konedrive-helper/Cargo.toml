[package]
name = "konedrive-helper"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# Test-only: two environment-armed panics that the VM suite uses
# to reach the unwind paths nothing input-reachable triggers. Off by default;
# never enable it in a build that ships. `tests/vm/run.sh` turns it on.
fault-injection = []

[dependencies]
anyhow.workspace = true
konedrive-fs = { path = "../konedrive-fs" }
konedrive-proto = { path = "../konedrive-proto" }
libc.workspace = true
nix = { workspace = true, features = ["dir", "fanotify", "fs", "poll", "socket", "uio", "user"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
