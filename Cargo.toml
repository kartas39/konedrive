[workspace]
resolver = "2"
members = ["crates/konedrive-dbus", "crates/konedrived", "crates/konedrivectl", "crates/konedrive-fs", "crates/konedrive-graph", "crates/konedrive-helper", "crates/konedrive-proto", "crates/konedrive-reason", "crates/konedrive-tree", "tests/write-account"]
# The test-account harness is built only when asked for (`-p konedrive-write-test`, or
# `--workspace`): a plain `cargo build --release` builds what ships (safety review m11).
default-members = ["crates/konedrive-dbus", "crates/konedrived", "crates/konedrivectl", "crates/konedrive-fs", "crates/konedrive-graph", "crates/konedrive-helper", "crates/konedrive-proto", "crates/konedrive-reason", "crates/konedrive-tree"]

[workspace.package]
# The next release's version, and the only place it is kept (docs/releasing.md, "The version"). Only
# the one-line pull request right after a release changes it. A build that is not a release shows
# it with `-dev` (a plain `cargo build`) or `-dev.N` (scripts/build-rpm.sh), which writes the
# build's version here and into Cargo.lock. The window reads it from here too (app/CMakeLists.txt).
version = "0.1.1"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
futures-util = "0.3"
getrandom = "0.2"
http-body-util = "0.1"
hyper = "1"
hyper-util = "0.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
libc = "0.2"
md-5 = "0.10"
nix = { version = "0.31", default-features = false }
oo7 = { version = "0.6", features = ["unstable"] }
percent-encoding = "2"
png = "0.18"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "stream"] }
rusqlite = { version = "0.40", features = ["bundled", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
# The live-change socket (issue #54): the websocket under Graph's Socket.IO endpoint, over rustls
# with the system's roots, as `reqwest`.
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
wiremock = "0.6"
xattr = "1"
zbus = { version = "5", default-features = false, features = ["tokio"] }
