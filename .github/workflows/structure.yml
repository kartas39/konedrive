# The guards that run on every pull request. Two run no test:
#
# - the structure rules (CONTRIBUTING.md, "The structure of the code"): the
#   no tests in a source file, the order of the daemon's layers (the sizes are
#   advice: listed, never a failure).
#   scripts/check-structure.sh reads the files only: nothing is built;
# - the links in the doc comments: rustdoc over the workspace, private items
#   included, with a link that does not resolve as an error. This one builds
#   the dependencies (checked, not linked) before it reads the comments.
#   What it does not catch is in CONTRIBUTING.md, "The structure of the code".
#
# And one that runs the tests of one small crate:
#
# - the generated C++ (app/generated/, dolphin/src/generated/) is what the
#   catalogue of sentences gives now, and every code has its words there
#   (crates/konedrive-text; CONTRIBUTING.md, "A new reason or refusal"). The
#   C++ build does not run cargo, so nothing else sees a catalogue changed
#   without its generated files.
name: Structure

on:
  pull_request:

permissions:
  contents: read

env:
  # The Rust the tests run with (tests.yml, RUST_VERSION): a newer rustdoc may
  # bring lints this workflow has not seen. Moved with that one.
  RUST_VERSION: "1.98.1"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Check the structure rules
        run: scripts/check-structure.sh

  doc-links:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # rustup is on the runner's image; the toolchain is pinned, not the
      # image's. Nothing else is installed: SQLite is built from the crate's
      # own source, and no other crate needs a system library to be checked.
      - name: Install Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustup default "$RUST_VERSION"
          rustc --version

      - name: Cache the crates and the doc build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: doc-rust-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: doc-rust-${{ env.RUST_VERSION }}-

      - name: Check the links in the doc comments
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links"
        run: cargo doc --locked --workspace --no-deps --document-private-items

  generated-texts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # As in doc-links: the pinned toolchain, and nothing else installed.
      - name: Install Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustup default "$RUST_VERSION"
          rustc --version

      - name: Cache the crates and the test build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: text-rust-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: text-rust-${{ env.RUST_VERSION }}-

      # The catalogue against the codes, and the generated files in git
      # against what the generator writes now.
      - name: Check the sentences and the generated files
        run: cargo test -p konedrive-text --locked
