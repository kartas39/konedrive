# A release on every push to main: the RPMs for each Fedora below (each built
# in that Fedora's container, with its own compiler), each installed in a clean
# container of that Fedora, where the programs must start; then the tag vX.Y.Z
# and a GitHub Release with the packages. No test of the code runs here: the
# pull requests ran them (tests.yml). Run by hand (workflow_dispatch) it is a
# dry run by default: the RPMs are kept as the run's artifacts, and nothing is
# tagged or released. docs/releasing.md.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build the RPMs and keep them as the run's artifacts; no tag, no release"
        type: boolean
        default: true

# One run at a time; a release in progress is never cancelled. GitHub keeps
# one waiting run per group: a newer one replaces it (docs/releasing.md).
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # The Fedoras the packages are built for: one build each, the same commit
    # and the same version, told apart by the dist tag (.fc44, .fc45).
    strategy:
      fail-fast: true
      matrix:
        fedora: [44, 45]
    container: fedora:${{ matrix.fedora }}
    timeout-minutes: 120
    env:
      # A release only from main: a push, or a run by hand with the dry run
      # turned off. Anything else is a dry run.
      RELEASE: >-
        ${{ github.ref == 'refs/heads/main' &&
        (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)) }}
    # The same from every build of the matrix.
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
    steps:
      # git before the checkout, so that it is a repository with its history
      # and tags.
      - name: Install the tools
        run: dnf -y install git rpm-build

      - name: Check out, with every tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The container runs as root; the checkout belongs to the runner's user.
      - name: Set up the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install the build dependencies
        run: dnf -y builddep packaging/rpm/konedrive.spec

      - name: Say which compiler builds them
        run: rustc --version

      # A release is X.Y.Z, the version in Cargo.toml. A dry run takes a local
      # build's version, X.Y.Z~dev.N (N: the commit count of HEAD's history,
      # hence the full clone above), which sorts below the release: installed,
      # its RPMs do not stand in the way of the release's upgrade.
      - name: Choose the version
        id: version
        run: |
          if [ "$RELEASE" = true ]; then
            version=$(scripts/version.sh release)
            previous_tag=$(scripts/version.sh previous "$version")
            echo "Release $version (previous tag: ${previous_tag:-none})"
          else
            version=$(scripts/version.sh local)
            previous_tag=
            echo "Dry run: $version"
          fi
          {
            echo "release=$RELEASE"
            echo "version=$version"
            echo "previous_tag=$previous_tag"
          } >>"$GITHUB_OUTPUT"

      - name: Build the RPMs
        run: |
          if [ "$RELEASE" = true ]; then
            scripts/build-rpm.sh --version "${{ steps.version.outputs.version }}"
          else
            scripts/build-rpm.sh
          fi

      - name: Collect the RPMs and their checksums
        run: |
          mkdir dist
          cp target/rpm/RPMS/*/*.rpm target/rpm/SRPMS/*.src.rpm dist/
          cd dist
          sha256sum -- *.rpm

      - name: Keep them as the run's artifacts
        uses: actions/upload-artifact@v7
        with:
          name: konedrive-${{ steps.version.outputs.version }}-fc${{ matrix.fedora }}
          path: dist/
          if-no-files-found: error

  # The packages a person would download, installed where nothing was built:
  # a missing dependency or a program that does not start stops the release
  # before anything is tagged.
  install:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        fedora: [44, 45]
    container: fedora:${{ matrix.fedora }}
    timeout-minutes: 30
    steps:
      - name: Fetch this Fedora's RPMs
        uses: actions/download-artifact@v8
        with:
          name: konedrive-${{ needs.build.outputs.version }}-fc${{ matrix.fedora }}
          path: dist

      # Both packages, as "sudo dnf install ./konedrive-*.rpm" does, without
      # the source RPM; dbus-daemon for the private bus below.
      - name: Install them
        run: |
          rm -f dist/*.src.rpm
          ls -l dist
          dnf -y install dbus-daemon dist/*.rpm

      - name: The programs find their libraries
        run: |
          missing=0
          for file in /usr/bin/konedrived /usr/bin/konedrivectl /usr/bin/konedrive /usr/libexec/konedrive-helper \
                      $(rpm -ql konedrive-kde | grep '\.so$'); do
            echo "== $file"
            if ldd "$file" | grep 'not found'; then
              missing=1
            fi
          done
          exit "$missing"

      - name: The daemon and the command line start
        run: |
          konedrived --version
          dbus-run-session -- konedrivectl --version

      # The window, with no display, on a bus of its own: it must load its
      # QML and come up hidden, and is then stopped. "ready" is its last line
      # of a start (app/main.cpp).
      - name: The window starts
        env:
          QT_QPA_PLATFORM: offscreen
          QT_LOGGING_RULES: konedrive.app.debug=true
          QT_FORCE_STDERR_LOGGING: "1"
          HOME: /tmp/home
          XDG_RUNTIME_DIR: /tmp/runtime
        run: |
          mkdir -p "$HOME" "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          set +e
          dbus-run-session -- timeout 30 konedrive --background >window.log 2>&1
          rc=$?
          set -e
          cat window.log
          if ! grep -q 'ready, window hidden' window.log; then
            echo "::error::the window did not come up (exit $rc)"
            exit 1
          fi

  # Only a release (the build job's RELEASE).
  publish:
    needs: [build, install]
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
      PREVIOUS_TAG: ${{ needs.build.outputs.previous_tag }}
    steps:
      # Every Fedora's, into one directory: their names differ by the dist tag.
      - name: Fetch the RPMs
        uses: actions/download-artifact@v8
        with:
          pattern: konedrive-${{ needs.build.outputs.version }}-fc*
          path: dist
          merge-multiple: true

      - name: List their checksums
        run: |
          cd dist
          sha256sum -- *.rpm >SHA256SUMS
          cat SHA256SUMS

      # A rerun after the tag was pushed finds it on this commit and reuses
      # it; the build job chose the same version (the file's). The tag on
      # another commit means the version was not bumped after the last
      # release (docs/releasing.md): the run stops.
      - name: Tag the commit
        run: |
          tag="v$VERSION"
          if ref=$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.type + " " + .object.sha' 2>/dev/null); then
            sha=${ref#* }
            if [ "${ref%% *}" = tag ]; then
              sha=$(gh api "repos/$GH_REPO/git/tags/$sha" --jq .object.sha)
            fi
            if [ "$sha" != "$GITHUB_SHA" ]; then
              echo "::error::$tag already exists, on $sha, not on $GITHUB_SHA"
              exit 1
            fi
            echo "$tag is already on $GITHUB_SHA: reused"
          else
            gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null
            echo "tagged $GITHUB_SHA as $tag"
          fi

      # A rerun finds the release and replaces its files instead of making a
      # second one. The notes list the pull requests merged since the
      # previous tag.
      - name: Publish the release
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            echo "release $tag existed: its files were replaced"
          else
            set -- --generate-notes
            if [ -n "$PREVIOUS_TAG" ]; then
              set -- "$@" --notes-start-tag "$PREVIOUS_TAG"
            fi
            gh release create "$tag" dist/* --verify-tag --title "KOneDrive $VERSION" "$@"
          fi
