# A release on every push to main: the daemon's tests (on the runner itself),
# then the RPMs (in a fedora:44 container), then the tag vX.Y.Z and a GitHub
# Release with the packages. Run by hand
# (workflow_dispatch) it is a dry run by default: the RPMs are kept as the
# run's artifacts, and nothing is tagged or released. docs/releasing.md.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build the RPMs and keep them as the run's artifacts; no tag, no release"
        type: boolean
        default: true

# One run at a time; a release in progress is never cancelled. GitHub keeps
# one waiting run per group: a newer one replaces it (docs/releasing.md).
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The Rust the tests run with: Fedora 44's `rust` package, which the RPMs are
  # built with. The build job stops if the two differ; when Fedora updates the
  # package, move this to the version it prints (docs/releasing.md).
  RUST_VERSION: "1.98.1"

jobs:
  # The daemon's unit tests, directly on the runner (a VM with its own kernel),
  # as its unprivileged user: a container's seccomp profile refuses
  # fanotify_init, which the watcher's tests need. A failure stops the run
  # before anything is built or tagged. Not the workspace (#21); not the tests
  # that need root (#44).
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # No incremental build: nothing is rebuilt in place, and the cache
      # stays smaller.
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # rustup is on the runner's image; the toolchain is pinned, not the
      # image's.
      - name: Install Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustup default "$RUST_VERSION"
          rustc --version

      # dbus-daemon for the tests' private buses. Unprivileged user
      # namespaces, which Ubuntu restricts through AppArmor, for the test
      # that mounts a tmpfs in one (a_subtree_on_another_filesystem_is_...).
      # Setup only: the tests themselves run without sudo.
      - name: Set up the runner
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends dbus-daemon
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Cache the crates and the test build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: runner-rust-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: runner-rust-${{ env.RUST_VERSION }}-

      - name: Test the daemon
        run: cargo test --locked -p konedrived --lib

  build:
    needs: test
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 120
    env:
      # A release only from main: a push, or a run by hand with the dry run
      # turned off. Anything else is a dry run.
      RELEASE: >-
        ${{ github.ref == 'refs/heads/main' &&
        (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)) }}
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
    steps:
      # git before the checkout, so that it is a repository with its history
      # and tags.
      - name: Install the tools
        run: dnf -y install git rpm-build

      - name: Check out, with every tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The container runs as root; the checkout belongs to the runner's user.
      - name: Set up the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install the build dependencies
        run: dnf -y builddep packaging/rpm/konedrive.spec

      # The RPMs are built with the Rust the tests ran with, or not at all.
      - name: Check the compiler against the tests'
        run: |
          have=$(rustc --version | cut -d' ' -f2)
          echo "rustc $have; the tests ran with $RUST_VERSION"
          if [ "$have" != "$RUST_VERSION" ]; then
            echo "::error::Fedora 44's rustc is $have, the tests ran with $RUST_VERSION: move RUST_VERSION in this workflow to $have (docs/releasing.md)"
            exit 1
          fi

      # A release is X.Y.Z. A dry run takes a local build's version,
      # X.Y.Z~dev.YYYYMMDD.SHA, which sorts below the release: installed, its
      # RPMs do not stand in the way of the release's upgrade.
      - name: Choose the version
        id: version
        run: |
          if [ "$RELEASE" = true ]; then
            version=$(scripts/version.sh release)
            previous_tag=$(scripts/version.sh previous "$version")
            echo "Release $version (previous tag: ${previous_tag:-none})"
          else
            version=$(scripts/version.sh local)
            previous_tag=
            echo "Dry run: $version"
          fi
          {
            echo "release=$RELEASE"
            echo "version=$version"
            echo "previous_tag=$previous_tag"
          } >>"$GITHUB_OUTPUT"

      - name: Build the RPMs
        run: |
          if [ "$RELEASE" = true ]; then
            scripts/build-rpm.sh --version "${{ steps.version.outputs.version }}"
          else
            scripts/build-rpm.sh
          fi

      - name: Collect the RPMs and their checksums
        run: |
          mkdir dist
          cp target/rpm/RPMS/*/*.rpm target/rpm/SRPMS/*.src.rpm dist/
          cd dist
          sha256sum -- *.rpm >SHA256SUMS
          cat SHA256SUMS

      - name: Keep them as the run's artifacts
        uses: actions/upload-artifact@v7
        with:
          name: konedrive-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error

  # Only a release (the build job's RELEASE).
  publish:
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
      PREVIOUS_TAG: ${{ needs.build.outputs.previous_tag }}
    steps:
      - name: Fetch the RPMs
        uses: actions/download-artifact@v8
        with:
          name: konedrive-${{ needs.build.outputs.version }}
          path: dist

      # A rerun after the tag was pushed finds it on this commit and reuses
      # it; the build job then chose the same version.
      - name: Tag the commit
        run: |
          tag="v$VERSION"
          if ref=$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.type + " " + .object.sha' 2>/dev/null); then
            sha=${ref#* }
            if [ "${ref%% *}" = tag ]; then
              sha=$(gh api "repos/$GH_REPO/git/tags/$sha" --jq .object.sha)
            fi
            if [ "$sha" != "$GITHUB_SHA" ]; then
              echo "::error::$tag already exists, on $sha, not on $GITHUB_SHA"
              exit 1
            fi
            echo "$tag is already on $GITHUB_SHA: reused"
          else
            gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null
            echo "tagged $GITHUB_SHA as $tag"
          fi

      # A rerun finds the release and replaces its files instead of making a
      # second one. The notes list the pull requests merged since the
      # previous tag.
      - name: Publish the release
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            echo "release $tag existed: its files were replaced"
          else
            set -- --generate-notes
            if [ -n "$PREVIOUS_TAG" ]; then
              set -- "$@" --notes-start-tag "$PREVIOUS_TAG"
            fi
            gh release create "$tag" dist/* --verify-tag --title "KOneDrive $VERSION" "$@"
          fi
