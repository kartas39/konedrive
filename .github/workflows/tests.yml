# The tests of a pull request.
#
# Into dev: the daemon's unit tests (on the runner itself) and the window's and
# the Dolphin plugins' (in a Fedora container, where Qt and KDE Frameworks are
# new enough). The catalogue of sentences has its own job in structure.yml.
#
# A release itself runs no test of the code (release.yml, docs/releasing.md).
name: Tests

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

# A newer push to the same pull request replaces the run under way.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Rust the tests run with, fixed so that a new compiler does not fail a
  # pull request by itself; structure.yml uses the same. The packages are built
  # with each Fedora's own (release.yml).
  RUST_VERSION: "1.98.1"
  CARGO_INCREMENTAL: "0"

jobs:
  # Directly on the runner, as its unprivileged user.
  daemon:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustup default "$RUST_VERSION"
          rustc --version

      # dbus-daemon for the tests' private buses. Setup only: the tests run
      # without sudo.
      - name: Set up the runner
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends dbus-daemon

      - name: Cache the crates and the test build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: runner-rust-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: runner-rust-${{ env.RUST_VERSION }}-

      - name: Test the daemon
        run: cargo test --locked -p konedrived -p konedrive-graph -p konedrive-reason -p konedrive-tree --lib --features konedrived/dev-tools

      # Nothing in the daemon that nothing calls (issue #262).
      - name: Check for dead code in the daemon
        run: scripts/check-dead-code.sh

  # The window and the Dolphin plugins, with the libraries the packages are
  # built with. Their tests use private buses and an offscreen display.
  window:
    runs-on: ubuntu-latest
    container: fedora:45
    timeout-minutes: 60
    steps:
      - name: Install the tools
        run: dnf -y install git dbus-daemon util-linux shadow-utils 'dnf-command(builddep)'

      - name: Check out
        uses: actions/checkout@v7

      # What the build needs, and what the window loads when it runs: the
      # packages the spec requires for its QML (packaging/rpm/konedrive.spec).
      - name: Install the build dependencies and the window's QML modules
        run: |
          dnf -y builddep packaging/rpm/konedrive.spec
          dnf -y install kf6-kirigami kf6-kirigami-addons kf6-kitemmodels kf6-kquickcharts kf6-qqc2-desktop-style qt6-qtdeclarative

      # Not as root, which the container's steps run as: a test of a file that
      # cannot be written means nothing to root.
      - name: Make a user for the tests
        run: |
          useradd --create-home tester
          chown -R tester: .

      - name: Test the window
        run: |
          runuser -u tester -- sh -ec '
            cmake -S app -B build/app -DBUILD_TESTING=ON
            cmake --build build/app -j "$(nproc)"
            ctest --test-dir build/app --output-on-failure
          '

      - name: Test the Dolphin plugins
        run: |
          runuser -u tester -- sh -ec '
            cmake -S dolphin -B build/dolphin -DBUILD_TESTING=ON
            cmake --build build/dolphin -j "$(nproc)"
            ctest --test-dir build/dolphin --output-on-failure
          '
