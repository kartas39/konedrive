# The tests of a pull request.
#
# Into dev, the fast ones: the daemon's unit tests (on the runner itself) and
# the window's and the Dolphin plugins' (in a Fedora container, where Qt and
# KDE Frameworks are new enough). The catalogue of sentences has its own job in
# structure.yml.
#
# Into main — a release is about to be made — the suite that needs root, on
# btrfs, ext4 and xfs: tests/vm/run.sh host, as root on the runner, which is
# itself a throwaway VM. Run by hand (workflow_dispatch) it is that suite too.
#
# A release itself runs no test of the code (release.yml, docs/releasing.md).
name: Tests

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request replaces the run under way.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Rust the tests run with, fixed so that a new compiler does not fail a
  # pull request by itself; structure.yml uses the same. The packages are built
  # with each Fedora's own (release.yml).
  RUST_VERSION: "1.98.1"
  CARGO_INCREMENTAL: "0"

jobs:
  # Directly on the runner (a VM with its own kernel), as its unprivileged
  # user: a container's seccomp profile refuses fanotify_init, which the
  # watcher's tests need.
  daemon:
    if: github.event_name == 'pull_request' && github.base_ref == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustup default "$RUST_VERSION"
          rustc --version

      # dbus-daemon for the tests' private buses. Unprivileged user
      # namespaces, which Ubuntu restricts through AppArmor, for the test
      # that mounts a tmpfs in one. Setup only: the tests run without sudo.
      - name: Set up the runner
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends dbus-daemon
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Cache the crates and the test build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: runner-rust-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: runner-rust-${{ env.RUST_VERSION }}-

      - name: Test the daemon
        run: cargo test --locked -p konedrived -p konedrive-graph -p konedrive-reason -p konedrive-tree --lib --features konedrived/dev-tools

  # The window and the Dolphin plugins, with the libraries the packages are
  # built with. Their tests use private buses and an offscreen display.
  window:
    if: github.event_name == 'pull_request' && github.base_ref == 'dev'
    runs-on: ubuntu-latest
    container: fedora:45
    timeout-minutes: 60
    steps:
      - name: Install the tools
        run: dnf -y install git dbus-daemon 'dnf-command(builddep)'

      - name: Check out
        uses: actions/checkout@v7

      - name: Install the build dependencies
        run: dnf -y builddep packaging/rpm/konedrive.spec

      - name: Test the window
        run: |
          cmake -S app -B build/app -DBUILD_TESTING=ON
          cmake --build build/app -j "$(nproc)"
          ctest --test-dir build/app --output-on-failure

      - name: Test the Dolphin plugins
        run: |
          cmake -S dolphin -B build/dolphin -DBUILD_TESTING=ON
          cmake --build build/dolphin -j "$(nproc)"
          ctest --test-dir build/dolphin --output-on-failure

  # The suite that needs root: the helper, fanotify, a filesystem of its own.
  # One machine per filesystem, all at once; each reports for itself.
  root-suite:
    if: github.event_name == 'workflow_dispatch' || github.base_ref == 'main' || github.head_ref == 'release-f45' # TEMPORARY: the last part goes before the merge
    strategy:
      fail-fast: false
      matrix:
        fs: [btrfs, ext4, xfs]
    # Named, not ubuntu-latest: the suite depends on the kernel, and a move to
    # another image is made here, on purpose.
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustup default "$RUST_VERSION"
          rustc --version

      - name: Set up the runner
        run: |
          uname -r
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends btrfs-progs xfsprogs e2fsprogs dbus-daemon attr

      - name: Cache the crates and the suite's build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tests/vm/target
          key: suite-rust-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock', 'tests/vm/Cargo.lock') }}
          restore-keys: suite-rust-${{ env.RUST_VERSION }}-

      - name: Run the suite on ${{ matrix.fs }}
        run: tests/vm/run.sh host ${{ matrix.fs }}
