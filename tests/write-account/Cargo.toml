# The guarded harness for the write phase's test account (`docs/design/writes.md` §12). It writes to a
# real OneDrive, so it is never run by `cargo test`: only its guards' tests are, against
# wiremock. How to run it: docs/design/writes.md, "Running against the test account".
[package]
name = "konedrive-write-test"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
bytes.workspace = true
clap.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
konedrived = { path = "../../crates/konedrived" }
libc.workspace = true
percent-encoding.workspace = true
reqwest.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
url.workspace = true

[dev-dependencies]
tempfile.workspace = true
wiremock.workspace = true
